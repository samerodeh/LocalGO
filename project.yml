name: LocalGOConsumer
options:
  bundleIdPrefix: com.localgo
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15"
  createIntermediateGroups: true

packages:
  StripeIOS:
    url: https://github.com/stripe/stripe-ios-spm
    from: "23.0.0"
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS.git
    from: "7.1.0"

targets:
  LocalGOConsumer:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: LocalGOConsumer
    dependencies:
      - package: StripeIOS
        product: StripePaymentSheet
      - package: GoogleSignIn
        product: GoogleSignIn
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.localgo.consumer
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        INFOPLIST_FILE: LocalGOConsumer/Info.plist
        SWIFT_VERSION: 5.9
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
